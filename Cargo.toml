[package]
name = "grove"
version = "0.1.0"
edition = "2024"
description = "Local cargo host: warm seed target, impact-scoped checks, worktree lanes that reuse registry artifacts"
license = "MIT"
repository = "https://github.com/thomgardiner/grove"
readme = "README.md"
publish = false
keywords = ["cargo", "worktree", "cache", "agents"]
categories = ["development-tools"]

[lib]
name = "grove"
path = "src/lib.rs"

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
# Test-only: age a lane's .grove-access stamp to exercise TTL and ceiling ordering.
filetime = "0.2"
